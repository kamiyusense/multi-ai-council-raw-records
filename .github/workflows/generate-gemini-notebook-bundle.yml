name: Generate Gemini Notebook Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*_RAW.md"
      - "scripts/generate_gemini_notebook_bundle.py"
      - "INDEX.md"
      - ".github/workflows/generate-gemini-notebook-bundle.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GEMINI_DRIVE_SYNC_URL: ${{ secrets.GEMINI_DRIVE_SYNC_URL }}
      GEMINI_DRIVE_SYNC_TOKEN: ${{ secrets.GEMINI_DRIVE_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate bundle and manifest
        env:
          GEMINI_BUNDLE_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/generate_gemini_notebook_bundle.py

      - name: Verify verbatim content and ordering
        env:
          GEMINI_BUNDLE_SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/generate_gemini_notebook_bundle.py --verify

      - name: Sync bundle to Google Drive
        if: ${{ env.GEMINI_DRIVE_SYNC_URL != '' && env.GEMINI_DRIVE_SYNC_TOKEN != '' }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --location --post302 \
            --request POST \
            --data-binary @GEMINI_NOTEBOOK_BUNDLE.md \
            "${GEMINI_DRIVE_SYNC_URL}?token=${GEMINI_DRIVE_SYNC_TOKEN}" \
            --output "$response_file"
          jq --exit-status '.ok == true' "$response_file" >/dev/null

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GEMINI_NOTEBOOK_BUNDLE.md NOTEBOOK_SYNC_MANIFEST.md
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "chore: update Gemini Notebook bundle"
          git push
