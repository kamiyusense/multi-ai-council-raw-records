name: Resolve PR #7 generated-file conflicts

on:
  push:
    branches:
      - feat/gemini-notebook-drive-sync
    paths:
      - .github/workflows/resolve-pr7-generated-conflicts.yml

permissions:
  contents: write

jobs:
  resolve-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/gemini-notebook-drive-sync
          fetch-depth: 0

      - name: Merge main and resolve generated files mechanically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected=$'GEMINI_NOTEBOOK_BUNDLE.md\nNOTEBOOK_SYNC_MANIFEST.md'
          actual="$(printf '%s\n' "${conflicts[@]}")"
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected merge conflicts:"
            printf '%s\n' "${conflicts[@]}"
            exit 1
          fi

          git checkout --theirs -- GEMINI_NOTEBOOK_BUNDLE.md NOTEBOOK_SYNC_MANIFEST.md
          git add GEMINI_NOTEBOOK_BUNDLE.md NOTEBOOK_SYNC_MANIFEST.md
          git commit -m "Merge origin/main into feat/gemini-notebook-drive-sync"

      - name: Regenerate and verify bundle artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_gemini_notebook_bundle.py
          python3 scripts/generate_gemini_notebook_bundle.py --verify

      - name: Commit regenerated artifacts and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/resolve-pr7-generated-conflicts.yml
          git add GEMINI_NOTEBOOK_BUNDLE.md NOTEBOOK_SYNC_MANIFEST.md
          git diff --cached --quiet || git commit -m "chore: regenerate Gemini Notebook bundle after main sync"
          git push origin HEAD:feat/gemini-notebook-drive-sync
